- id: R26
  key: LMPC.3.CHAPTER_II_EXCLUSIONS
  rule_ref: "Rule 3"
  title_en: "Bulk & Industrial Package Exclusion (>25kg/L)"
  title_hi: "थोक और औद्योगिक पैकेज छूट (>25kg/L)"
  severity: low
  check:
    all:
      - present: { field: "net_quantity.value" }
  on_fail: N/A
  evidence: "declarations.net_quantity.bbox"
  message_en: "Packages > 25 kg/L or not for retail sale are excluded from Chapter II rules."
  message_hi: "25 किग्रा/लीटर से अधिक के पैकेज अध्याय II के नियमों से बाहर हैं।"
  fix_hint_en: "No action needed for bulk non-retail packages."
