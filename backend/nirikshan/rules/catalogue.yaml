  effective_from: "2011-03-01"
  source: "LMPC Rules 2011"

- id: R35
  key: LMPC.7.5.FOOD_GATING_RULE
  rule_ref: "Rule 7(5) / Rule 6(1)(a) Expl. III"
  title_en: "Food Category Alignment (FSS Act)"
  title_hi: "खाद्य श्रेणी समन्वय (FSS एक्ट)"
  severity: low
  check:
    all:
      - present: { field: "net_quantity.value" }
  on_fail: PASS
  evidence: "declarations.net_quantity.bbox"
  message_en: "Food packages are governed by FSS Act for dates and manufacturer address; LMPC font rules apply to Net Qty, MRP, Best Before and Consumer Care."
  message_hi: "खाद्य उत्पाद FSS एक्ट द्वारा शासित हैं; LMPC नियम शुद्ध मात्रा, MRP, बेस्ट बिफोर पर लागू होते हैं।"
  fix_hint_en: "Ensure compliance with both FSSAI regulations and LMPC net quantity/MRP rules."
  effective_from: "2011-03-01"
  source: "LMPC Rules 2011"

- id: C01
