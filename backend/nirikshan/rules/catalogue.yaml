  source: "LMPC Rules 2011"

- id: R34
  key: LMPC.14.DIMENSIONS_COUNT_DECLARATION
  rule_ref: "Rules 14–17"
  title_en: "Dimensions / Sheet Count Declaration for Specific Categories"
  title_hi: "विशिष्ट श्रेणियों के लिए आयाम / टुकड़ा संख्या घोषणा"
  severity: low
  check:
    all:
      - has_dimension_or_sheet_count: {}
  on_fail: NEEDS_REVIEW
  evidence: "declarations.net_quantity.bbox"
