- id: R27
  key: LMPC.24.WHOLESALE_PACKAGE
  rule_ref: "Rule 24"
  title_en: "Wholesale Package Declarations"
  title_hi: "थोक पैकेज घोषणाएं"
  severity: high
  check:
    all:
      - any:
          - present: { field: "manufacturer.name" }
          - present: { field: "packer.name" }
      - present: { field: "generic_name.value" }
      - present: { field: "net_quantity.value" }
  on_fail: FAIL
  evidence: "declarations.net_quantity.bbox"
  message_en: "Wholesale packages must contain name/address, generic name, and net quantity/count."
  message_hi: "थोक पैकेजों पर नाम/पता, जेनेरिक नाम और शुद्ध मात्रा होनी चाहिए।"
  fix_hint_en: "Add manufacturer details, commodity name, and total count/net quantity on wholesale pack."
  effective_from: "2011-03-01"
  source: "LMPC Rules 2011"

- id: R28
  key: LMPC.6.5.COMBINATION_MULTI_PIECE
  rule_ref: "Rule 6(5)"
