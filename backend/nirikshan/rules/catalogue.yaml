- id: R33
  key: LMPC.6.4A.GTIN_BARCODE
  rule_ref: "Rule 6(4A)"
  title_en: "GTIN / Barcode Declaration"
  title_hi: "जीटीआईएन / बारकोड घोषणा"
  severity: low
  check:
    all:
      - has_gtin: {}
  on_fail: N/A
  on_uncertain:
    - when_pass:
        all:
          - has_gtin: {}
      verdict: INFO
      message_en: "INFO: GTIN/barcode present on package"
      message_hi: "सूचना: पैकेज पर जीटीआईएन/बारकोड मौजूद है"
  evidence: "declarations.gtin.bbox"
  message_en: "no barcode detected"
  message_hi: "कोई बारकोड नहीं मिला"
  fix_hint_en: "Optionally add EAN/UPC/GTIN barcode to PDP."
