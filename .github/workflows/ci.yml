name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install opencv-python-headless --force-reinstall
      - name: Run Backend Pytest
        run: |
          cd backend
          pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Local Image for Smoke Test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nirikshan-test:local
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha

      - name: Container Smoke Test
        run: |
          docker run -d --name nirikshan-smoke -p 7860:7860 nirikshan-test:local
          python -c "
          import time, urllib.request, json
          start = time.time()
          ok = False
          while time.time() - start < 90:
              try:
                  with urllib.request.urlopen('http://localhost:7860/api/health') as resp:
                      data = json.loads(resp.read().decode())
                      print('Health poll:', data)
                      if data.get('model_loaded') is True:
                          ok = True
                          break
              except Exception as e:
                  print('Waiting for server...', e)
              time.sleep(3)
          if not ok:
              raise SystemExit('Container failed to load model within 90s')
          "
          python -c "
          import urllib.request, json, uuid
          img_path = 'backend/tests/fixtures/images/synthetic/four_violations.png'
          boundary = '----WebKitFormBoundary' + uuid.uuid4().hex
          body = bytearray()
          body.extend(f'--{boundary}\r\n'.encode())
          body.extend(b'Content-Disposition: form-data; name=\"file\"; filename=\"four_violations.png\"\r\n')
          body.extend(b'Content-Type: image/png\r\n\r\n')
          body.extend(open(img_path, 'rb').read())
          body.extend(f'\r\n--{boundary}--\r\n'.encode())
          req = urllib.request.Request('http://localhost:7860/api/scan', data=bytes(body), headers={'Content-Type': f'multipart/form-data; boundary={boundary}'})
          with urllib.request.urlopen(req) as resp:
              assert resp.status == 200, f'Expected HTTP 200, got {resp.status}'
              data = json.loads(resp.read().decode())
              assert data.get('summary', {}).get('status') == 'Non-compliant', f'Expected Non-compliant, got {data}'
              print('Smoke test scan PASSED!')
          "
          docker rm -f nirikshan-smoke

      - name: Push Container Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.sha_short }}
          tags: |
            ghcr.io/rajputjay00/nirikshan:latest
            ghcr.io/rajputjay00/nirikshan:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write Summary
        run: |
          echo "### Pushed Container Image" >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/rajputjay00/nirikshan:${{ steps.vars.outputs.sha_short }}" >> $GITHUB_STEP_SUMMARY
